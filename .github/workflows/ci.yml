# Build, unit tests, regression (serial and 4 MPI ranks), the AMR MPI check (1-7 ranks) and the ghost-cell IBM MPI check (2-7
# ranks, both bitwise against serial) on Linux x64 / ARM64, macOS and Windows.
# Every platform must reproduce the reference states in cpp/tests/reference/ (tolerance 1e-8).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hosted runners have 3-4 cores; the X-decomposition cases need 4 ranks
  OMPI_MCA_rmaps_base_oversubscribe: "yes"                   # Open MPI 4
  PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"    # Open MPI 5

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64 (GCC, Open MPI)", os: ubuntu-latest }
          - { name: "Linux ARM64 (GCC, Open MPI)", os: ubuntu-24.04-arm }
          - { name: "macOS arm64 (Apple clang, libomp, Open MPI)", os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libopenmpi-dev openmpi-bin
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja libomp open-mpi
      - run: python -m pip install -e python
      - name: Build
        run: |
          cmake --preset release 2>&1 | tee configure.log
          grep -q "Found OpenMP" configure.log || { echo "::error::OpenMP not found"; exit 1; }
          grep -q "MPI enabled" configure.log || { echo "::error::MPI not found"; exit 1; }
          # Compiler and linker errors become annotations (visible without the full log)
          cmake --build --preset release -j 4 > build.log 2>&1 || {
            grep -E "error|Error|undefined reference|multiple definition|ld:" build.log | head -30 |
              while IFS= read -r line; do echo "::error::$line"; done
            tail -60 build.log; exit 1; }
          grep -cE "warning" build.log | xargs -I{} echo "{} compiler warning lines"
      - name: Unit tests
        run: ./build/release/fenice_tests
      - name: Regression (serial)
        run: python cpp/tests/regression.py
      - name: Regression (4 MPI ranks)
        run: python cpp/tests/regression.py --mpi 4
      - name: AMR on 1-7 MPI ranks bitwise equal to serial
        run: python cases/validation/amr/amr_mpi.py --check
      - name: AMR with every rank holding the whole topology (FENICE_REPLICATED_TOPOLOGY=1), bitwise equal to serial
        env:
          FENICE_REPLICATED_TOPOLOGY: "1"
        run: python cases/validation/amr/amr_mpi.py --check
      - name: Ghost-cell IBM on 2-7 MPI ranks bitwise equal to serial
        run: python cases/validation/features/ibm_ghost.py --check
      - name: Manufactured solutions (quick order study)
        run: |
          python -m pip install sympy matplotlib
          python cases/validation/verification/mms.py

  windows:
    name: Windows x64 (MSVC, MS-MPI)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi
      - run: python -m pip install -e python
      - name: Build and unit tests
        shell: pwsh
        run: |
          .\cpp\build.ps1 -Test
          if (-not (Select-String -Path build\release\build.ninja -Pattern "FV_USE_MPI" -Quiet)) { throw "MPI not compiled in" }
      - name: Regression (serial)
        run: python cpp/tests/regression.py
      - name: Regression (4 MPI ranks)
        run: python cpp/tests/regression.py --mpi 4
      - name: AMR on 1-7 MPI ranks bitwise equal to serial
        run: python cases/validation/amr/amr_mpi.py --check
      - name: AMR with every rank holding the whole topology (FENICE_REPLICATED_TOPOLOGY=1), bitwise equal to serial
        env:
          FENICE_REPLICATED_TOPOLOGY: "1"
        run: python cases/validation/amr/amr_mpi.py --check
      - name: Ghost-cell IBM on 2-7 MPI ranks bitwise equal to serial
        run: python cases/validation/features/ibm_ghost.py --check
      - name: Manufactured solutions (quick order study)
        run: |
          python -m pip install sympy matplotlib
          python cases/validation/verification/mms.py
