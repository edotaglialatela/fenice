# The IBM Airfoil case on a 192 x 96 base mesh with block-structured AMR: 16 x 16 patches, two
# refinement levels (up to 768 x 384 equivalent), the body kept at the finest level and the wake
# refined where the density or the speed has gradients. The body resolution equals the 720 x 360 uniform case
# with a fraction of its cells. Runs on OpenMP threads (AMR under MPI is correct but slower on one
# node); the monitor file has Cl, Cd, Cm as in the uniform case.

[case]
name = "IBM Airfoil AMR"
description = "IBM airfoil on a 192 x 96 mesh with AMR (body at 768 x 384), Re = 1000"
order = 46
requires_viscous = true

[mesh]
Lx = 12.0
Ly = 6.0
nx = 192
ny = 96

[physics]
use_viscous = true
reynolds = 1000.0
use_bodyforce = false

[boundaries]
bc_left = "vel_inlet"
bc_right = "nonreflecting"
bc_bottom = "wall"
bc_top = "wall"
u_in = 1.0
rho_in = 1.0
p_out = 17.857142857142858

[numerics]
riemann_solver = "HLLC (Low-Mach Thornber)"
use_muscl = true
muscl_limiter = "Van Leer"
time_scheme = "SSP Runge-Kutta 2"
cfl = 0.5

[run]
t_end = 20.0
save_interval = 500
monitor_interval = 20

[parallel]
use_mpi = false

[amr]
use_amr = true
amr_patch_nx = 16
amr_patch_ny = 16
amr_max_level = 2
amr_refine_every = 5
amr_refine_ibm = true
amr_indicator = "density+velocity"

[ibm]
use_ibm = true
ibm_shape = "NACA 0012"
ibm_cx = 3.0
ibm_cy = 3.0
ibm_chord = 1.0
ibm_aoa = 10.0

[initial]
state = { rho = 1.0, u = 1.0, v = 0.0, p = 17.857142857142858 }
