# A NACA 0012 at Re = 1000 and Ma = 0.2 that rests at 0 degrees until t = 15 (the wake develops), pitches nose-up about its quarter chord to 15 degrees
# in 1.5 time units (ibm_omega, negative = nose-up, from ibm_omega_from to ibm_omega_until) and holds the angle. Prescribed motion, adaptive mesh,
# the body at the finest level. Without ibm_omega it is the static airfoil at ibm_aoa.

[case]
name = "IBM Airfoil Pitch"
description = "NACA 0012, Re = 1000: rest, pitch-up about the quarter chord, hold (AMR, body at the finest level)"
requires_viscous = true

[mesh]
Lx = 12.0
Ly = 6.0
nx = 720
ny = 360

[physics]
use_viscous = true
reynolds = 1000.0
use_bodyforce = false

[boundaries]
bc_xmin = "vel_inlet"
bc_xmax = "nonreflecting"
bc_ymin = "wall"
bc_ymax = "wall"
u_in = 1.0
rho_in = 1.0
p_out = 17.857142857142858

[numerics]
riemann_solver = "HLLC (Low-Mach Thornber)"
reconstruction = "muscl"
muscl_limiter = "Van Leer"
time_scheme = "SSP Runge-Kutta 2"
cfl = 0.5

[run]
t_end = 45.0
save_interval = 1000000000
monitor_interval = 5

[parallel]
use_mpi = false

[amr]
use_amr = true
amr_max_level = 2
amr_refine_every = 5
amr_indicator = "density+velocity"

[ibm]
use_ibm = true
ibm_shape = "NACA 0012"
ibm_cx = 3.0
ibm_cy = 3.0
ibm_chord = 1.0
ibm_aoa = 0.0
ibm_omega = -0.174532925199433
ibm_omega_from = 15.0
ibm_omega_until = 16.5

[initial]
state = { rho = 1.0, u = 1.0, v = 0.0, p = 17.857142857142858 }
